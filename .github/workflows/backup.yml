name: Weekly Database Backup

on:
  schedule:
    - cron: '0 3 * * 0'  # Dimanche 3h UTC (= 4h/5h Paris)
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run backup
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          FIXLYY_SERVICE_ROLE_KEY: ${{ secrets.FIXLYY_SERVICE_ROLE_KEY }}
        run: pnpm dlx tsx scripts/backup-db.ts

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: backups/
          retention-days: 90
          if-no-files-found: error
