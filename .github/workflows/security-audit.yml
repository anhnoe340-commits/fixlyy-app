name: Security Audit
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: pnpm audit (no high/critical en prod)
        run: pnpm audit --prod --audit-level=high
      - name: Check for hardcoded secrets
        run: |
          if grep -rn "sk_live\|rk_live_\|AKIA" --include="*.ts" --include="*.tsx" --include="*.js" src/ supabase/functions/ 2>/dev/null | grep -v "test\|mock\|example"; then
            echo "❌ CRITICAL: Hardcoded secrets found!"
            exit 1
          fi
          echo "✅ No hardcoded secrets"
      - name: Check CORS configuration
        run: |
          if grep -rnE "Access-Control-Allow-Origin['\"]?\s*[:,]\s*['\"]\*['\"]" supabase/functions/ 2>/dev/null | grep -v "?"; then
            echo "❌ CRITICAL: CORS wildcard found!"
            exit 1
          fi
          echo "✅ CORS properly configured"
      - name: Security audit script
        run: bash scripts/security-audit.sh
